name: Release Website

on:
    push:
        tags:
            - "website-v*"

concurrency:
    group: release-website-${{ github.ref }}

jobs:
    release:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: website
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.0
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "pnpm"
                  cache-dependency-path: website/pnpm-lock.yaml
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Build website
              run: pnpm run build
            - name: Archive website build
              run: |
                  if [ -d out ]; then tar -czf ../website-build.tar.gz out; else tar -czf ../website-build.tar.gz .next public package.json; fi
            - name: Create GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  name: Website Release ${{ github.ref_name }}
                  files: website-build.tar.gz
