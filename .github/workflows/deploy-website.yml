name: Deploy Website to Azure

on:
  push:
    branches:
      - master
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

concurrency:
  group: deploy-website-${{ github.event.pull_request.number || github.ref }}

permissions:
  contents: read
  pull-requests: write

env:
  AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
  ENVIRONMENT: prod
  REGION_ABBR: san
  LOCATION: eastus2

jobs:
  build_and_deploy:
    name: Build and Deploy Next.js Website
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Build Next.js app
        working-directory: website
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Deploy to Azure Static Web Apps
        if: env.AZURE_STATIC_WEB_APPS_API_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "website/out"
          skip_app_build: true

      - name: Skip deploy when token is missing
        if: env.AZURE_STATIC_WEB_APPS_API_TOKEN == ''
        run: echo "AZURE_STATIC_WEB_APPS_API_TOKEN is not configured; build completed without deployment."

  # PR validation - build only, no deploy
  validate_pr:
    name: Validate Website Build (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Build Next.js app
        working-directory: website
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Validate build output
        run: |
          echo "âœ… Website build successful!"
          if [ -d "website/out" ]; then
            ls -la website/out/
            if [ -f "website/out/index.html" ] || [ -d "website/out/index" ]; then
              echo "âœ… Build output validated - index found"
            else
              echo "::warning::index.html not found but build completed"
            fi
          else
            echo "Note: Output directory 'website/out' not found - Next.js may use different output config"
          fi
